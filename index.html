<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Quotes Generator</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <main>
      <h1>Random Quotes</h1>
      <section class="quotes" aria-labelledby="quote-heading">
        <h2 id="quote-heading" class="visually-hidden">Current quote</h2>
        <span class="quote-id" aria-label="Quote number">0</span>
        <blockquote class="quote-display">Quote will appear here</blockquote>
        <div class="buttons">
          <button class="generate" type="button">Generate quote</button>
          <button class="auto" type="button">Start auto-play</button>
          <button class="stop" type="button">Stop auto-play</button>
          <button class="copy" type="button" disabled>Copy quote</button>
        </div>
      </section>
      <p class="auto-status" role="status" aria-live="polite">Ready</p>
    </main>
    <script src="main.js"></script>
  </body>
</html>
